# Databricks Asset Bundle — deploys the pipeline as a scheduled Lakeflow Job.
# Optional (advanced): `databricks bundle deploy` then `databricks bundle run tradebooks_pipeline`
bundle:
  name: tradebooks-lakehouse

variables:
  catalog:
    default: workspace
  schema:
    default: tradebooks

resources:
  jobs:
    tradebooks_pipeline:
      name: "TradeBooks · Medallion Pipeline"
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"   # every day 6:00 AM
        timezone_id: America/New_York
        pause_status: PAUSED
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: setup
          notebook_task: { notebook_path: ./notebooks/00_setup.py }
        - task_key: generate_data
          depends_on: [{ task_key: setup }]
          notebook_task: { notebook_path: ./notebooks/01_generate_data.py }
        - task_key: bronze
          depends_on: [{ task_key: generate_data }]
          notebook_task: { notebook_path: ./notebooks/02_bronze_ingest.py }
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task: { notebook_path: ./notebooks/03_silver_transform.py }
        - task_key: gold
          depends_on: [{ task_key: silver }]
          notebook_task: { notebook_path: ./notebooks/04_gold_marts.py }
        - task_key: analytics
          depends_on: [{ task_key: gold }]
          notebook_task: { notebook_path: ./notebooks/05_analytics_insights.py }

targets:
  dev:
    default: true
    mode: development
